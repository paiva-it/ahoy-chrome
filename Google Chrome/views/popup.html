<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Ahoy! Personal</title><link rel="stylesheet" href="style.css"><script type="module" src="popup.js"></script></head>
<body class="popup"><header><img src="../icons/color/48x48.png" alt=""><div><h1>Ahoy!</h1><div class="eyebrow">Your personal connection</div></div></header>
<div class="top"><div class="status"><span id="dot" class="dot"></span><span id="status">Loading…</span></div><span id="count" class="chip">0 sites</span></div>
<div class="card"><div class="eyebrow">Current website</div><p class="host" id="host">—</p><p class="muted" id="route">Open a website to add it.</p><button id="add" class="wide" disabled>Add this site</button></div>
<button id="toggle" class="primary wide" disabled>Turn on</button><button id="options" class="wide">Sites & connection settings</button>
<p id="message" role="status" class="message"></p><div class="foot">Only sites on your list use the proxy. No Ahoy account. No browsing telemetry.</div></body></html>
